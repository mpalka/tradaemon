services:
  bot:
    build: .
    command: python -m trademon.engine
    # No `dns:` here on purpose. It was added on the guide's theory that DSM leaves
    # a loopback address in /etc/resolv.conf, which inside a container points at the
    # container — but measured on the actual NAS that was simply untrue (the host
    # lists its router and answers 20/20 in 5ms, faster than any public resolver).
    # Pinning public resolvers only pushed every lookup out through NAT, and name
    # resolution started failing intermittently. Docker's embedded resolver
    # forwarding to the host's own is both the default and the fastest path; add a
    # `dns:` key only after confirming the host's resolver is genuinely broken.
    # Classic string form: the extended `path:`/`required:` syntax needs
    # Compose 2.20+, which Synology's Container Manager does not ship.
    # Consequence: .env must exist — `cp .env.example .env` on a fresh checkout.
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./runtime:/app/runtime
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run src/trademon/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./runtime:/app/runtime
    restart: unless-stopped

  # Module 2: portfolio manager (slow investing, paper). Daily loop; rebalances
  # a diversified ETF basket toward target weights. Shares the dashboard.
  portfolio:
    build: .
    command: python -m trademon.portfolio
    # Classic string form: the extended `path:`/`required:` syntax needs
    # Compose 2.20+, which Synology's Container Manager does not ship.
    # Consequence: .env must exist — `cp .env.example .env` on a fresh checkout.
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./runtime:/app/runtime
    restart: unless-stopped

  # Weekly maintenance: refresh data + retrain behind the safety gate.
  # The bot hot-reloads promoted models on its next candle (no restart needed).
  refresher:
    build: .
    command: >
      sh -c "while true; do
        python scripts/refresh.py || echo 'refresh gate failed or errored — kept current model';
        sleep 604800;
      done"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./runtime:/app/runtime
    restart: unless-stopped
