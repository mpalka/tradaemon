[project]
name = "tradaemon"
dynamic = ["version"]
description = "Educational algorithmic-trading lab: an ML crypto scalper, an ETF rebalancer and a cross-sectional ranking study, all paper-traded. Not investment advice."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trading", "backtesting", "machine-learning", "paper-trading", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "streamlit>=1.36",
    "altair>=5.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tradaemon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tradaemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
