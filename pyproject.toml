[project]
name = "trademon"
version = "0.1.0"
description = "ML-driven crypto scalping bot with paper trading"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "streamlit>=1.36",
    "altair>=5.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trademon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
