# TraDaemon 👹💰 configuration.
# mode: "paper" (default, virtual money) or "live" (real funds — requires API keys
# in .env and a conscious decision; see README).
mode: paper

exchange:
  id: binance
  # Top-liquidity USDT pairs only — the cost model (2 bps slippage) is honest
  # for majors; thinner pairs would trade worse than the backtest suggests.
  #
  # Eighteen, not ten, since 2026-08: ten pairs did not produce enough
  # simultaneous candidates to fill the book. The ryzyko_100 variant showed it
  # plainly — five slots, three positions, and 405 USDT of idle cash next to
  # them. Measured before the change with scripts/research/universe.py (a model
  # refitted before each window, and the pairs competing for one wallet the way
  # the engine makes them): eighteen beat ten in all six paired comparisons,
  # by +0.4 to +3.6 pp per window, and beat it per unit of exposure too, so it
  # is not merely the wider board sitting in the market longer. Not one of those
  # differences is statistically significant — consistent sign on a weak effect
  # is the whole claim.
  symbols: [BTC/USDT, ETH/USDT, SOL/USDT, BNB/USDT, XRP/USDT,
            DOGE/USDT, ADA/USDT, LINK/USDT, AVAX/USDT, LTC/USDT,
            DOT/USDT, TRX/USDT, ATOM/USDT, BCH/USDT,
            XLM/USDT, UNI/USDT, ETC/USDT, NEAR/USDT]
  # 4h chosen from a 365-day, 4-pair sweep (2026-07): best OOS combo on the
  # last 60 days (+0.2% vs -12.5% buy&hold), stable across thresholds.
  # On 1m candles the median TP distance never clears round-trip costs.
  timeframe: 4h

# Language for everything with no viewer attached: engine alerts, webhook messages and
# printed reports. "pl" or "en"; an unknown value falls back to the default. Dashboard
# viewers pick their own per session (top right, or ?lang=), so this does not constrain
# them — it only decides what a headless process says.
display_language: pl

paths:
  data_dir: data
  models_dir: models
  runtime_dir: runtime   # state.json + trades.jsonl (journal), shared with dashboard

costs:
  taker_fee: 0.001       # Binance spot default 0.1%
  maker_fee: 0.001
  slippage_bps: 2.0      # additional adverse slippage assumed per fill

strategy:
  atr_period: 14
  tp_atr_mult: 1.5       # take-profit distance in ATR units (sweep2 best OOS combo)
  sl_atr_mult: 2.0       # stop-loss distance in ATR units
  horizon_bars: 12       # triple-barrier timeout, in bars (12 x 4h = 2 days)
  rollover: true         # when an exit would be followed by an immediate re-entry
                         # (the signal is still above the threshold), extend the
                         # position instead — new TP/SL and deadline, no fills.
                         # Only when the round trip does not pay for itself:
                         # exiting is kept whenever the exit price beats the
                         # re-entry price by more than the two fees. At a timeout
                         # both prices are the same bar close, so it always
                         # extends; at a take-profit it depends on where the bar
                         # closed. Stop-losses never extend.

  prob_threshold: 0.55   # minimal model probability to open a position
                         # (lower = more trades; 0.50 ~ +39% vs 0.60, still ~0 edge)
  warmup_bars: 300       # history needed before features are valid

paper:
  initial_capital: 1000.0

risk:
  position_pct: 0.10          # fraction of current equity per position
  max_open_positions: 5   # 5 x 10% = max 50% equity exposure; crypto pairs are
                          # highly correlated, so open positions cluster.
                          #
                          # The cap is not a comfort setting — on the eighteen-pair
                          # board it is the single strongest effect this project has
                          # measured. Over ten 90-day windows (a model refitted before
                          # each one, scripts/research/universe.py), a cap of 3 beat a
                          # cap of 10 by +4.5 pp per window, 8 windows out of 10,
                          # t = +2.7 to +3.5 — the only result here that clears the
                          # usual significance bar. The mechanism: a wide board pays
                          # as a pool to *choose from*, not as a list to fill. At 10
                          # slots the book simply takes everything that signals (2609
                          # trades against 1713 on ten pairs, at the same 80% time in
                          # market), so the extra pairs buy turnover and fees, nothing
                          # else — and widening the board actively hurts (-2.3 pp).
                          # Three measured best; five is the chosen trade-off, keeping
                          # more capital at work.
  daily_loss_limit_pct: 0.03  # kill-switch: stop opening positions after -3% day

model:
  # Full downloaded history (2021-02 onward). 365 was not merely small, it was
  # misleading: that slice is one bear regime end to end, and models fitted on
  # it lost to a naive always-short control in all 20 TP/SL variants — a result
  # that reverses on 5.5 years, where the model beats every naive control.
  # Measured by scripts/research/fee_grid.py; see the README research section.
  # Also sets the refresher's weekly download window (scripts/refresh.py), so
  # a small value here quietly caps how much history the bot ever collects.
  train_window_days: 2000
  validation_days: 60
  n_folds: 5

# Optional live A/B: each variant is a separate paper book trading the same
# candles in parallel, compared on the dashboard's "Warianty" tab. Comment out
# to run a single "default" book. Overrides apply on top of `strategy`/`risk`.
variants:
  - {name: prog_055, prob_threshold: 0.55}
  - {name: prog_050, prob_threshold: 0.50}
  - {name: prog_065, prob_threshold: 0.65}
  # Added in 0.1.16 to settle a question the backtest cannot. The measurement in
  # scripts/research/prob_calibration.py says the model's probability is worth
  # something only near the top: at TP/SL 1.5/2.0 a trade needs 57.1% wins to break
  # even, and over 6 windows x 120 days only signals above ~0.58 cleared it (60.5%
  # and 63.9% in the top two quintiles, against 55.4 / 53.6 / 53.9 below).
  #
  # A strict-OOS sweep of the whole book agreed and put the payoff at +2.9 pp per
  # window against 0.55, better in 5 windows of 6 — but with t = +1.0 under the
  # engine's own fcfs allocation, because the windows differ from each other far
  # more than the thresholds do (-15% to +25% at one and the same threshold). That
  # is not a number to reconfigure the primary book on; it is a number to put in
  # front of the market and watch. Hence a book rather than an edit.
  #
  # 0.60, not the sweep's argmax of 0.58: the two are +2.87 and +2.80 pp, a gap far
  # inside the noise, so picking the higher one would be fitting the sweep. 0.60 is
  # the code default in config.py, it sits evenly between the books either side of
  # it, and it holds less: 55% of bars in the market against 82% at 0.55, and 30%
  # fewer trades to pay fees on.
  #
  # What to watch: the sweep says the gain comes from losing less when the market
  # falls (-8.3% -> -3.5% per window) rather than winning more when it rises
  # (+13.3% -> +12.3%). If this book only ever ties in a bull run, that is the
  # result, not a disappointment. Compare it against prog_055 on the same exposure,
  # not against buy&hold — it is out of the market nearly half the time.
  - {name: prog_060, prob_threshold: 0.60}
  # Risk-appetite A/B. Identical signal to prog_050 (the primary book) — only the
  # sizing differs: 5 x 20% = up to 100% of the account in the market, against
  # prog_050's 5 x 10% = 50%. Since 0.1.11 the two books share the same number of
  # slots, so the comparison isolates position size alone — cleaner than before,
  # when it varied both at once (5 slots vs 3) and the curves could not say which
  # of the two was doing the damage.
  #
  # Expect it to lose, and to lose faster. On the measured daily
  # returns the crypto strategy's Kelly-optimal fraction is ~0.47 — below 1x — so
  # 100% exposure is roughly twice past the optimum, where the variance penalty
  # (L^2) overtakes the return (L). The point of this book is to make that visible
  # day by day rather than argued on a chart.
  - {name: ryzyko_100, prob_threshold: 0.50, position_pct: 0.20, max_open_positions: 5}

# Which book the beginner screen calls "your portfolio". Pinned so the high-appetite
# experiment above can never drift onto the main screen as if it were the portfolio;
# it belongs in the Warianty comparison, where its cost is visible next to the others.
primary_variant: prog_050
