# Portfolio manager (module 2) — slow, systematic investing. Paper only,
# educational. Value = discipline + costs + diversification, NOT prediction.
source: yahoo   # free daily data via Yahoo Finance chart API (keyless)
initial_capital: 10000.0
book_name: core
bars_per_year: 252   # ETF trading days per year (Sharpe annualization)

# Classic diversified basket. Symbols are plain Yahoo tickers (SPY, TLT, GLD).
# Weights are normalized, so they need not sum to 1.
assets:
  - {symbol: SPY, target_weight: 0.50, safe: false}   # US equities
  - {symbol: TLT, target_weight: 0.30, safe: true}    # long-term US treasuries
  - {symbol: GLD, target_weight: 0.20, safe: false}   # gold

rebalance:
  cadence_days: 90          # quarterly at the latest
  drift_threshold_pct: 5.0  # ...or sooner if any weight drifts >5 percentage points

# Optional trend filter (systematic tilt). OFF by default — pure discipline first.
# When on: an asset trading below its `ma_days` average is parked in `safe_asset`
# (or cash if none), and re-bought when it recovers above the average.
trend:
  enabled: false
  ma_days: 200
  safe_asset: TLT

# Diversification screen (scripts/correlation_screen.py): what moves differently from
# world equities? Benchmark VT = Vanguard Total World, the USD proxy for FTSE
# All-World with the longest Yahoo history (VWRL.L is the literal FTSE All-World ETF
# but quotes in GBP, which would mix a currency effect into every correlation).
#
# The candidate list deliberately includes inverse and volatility products (SH, PSQ,
# VIXY, BTAL). They top any correlation ranking and lose money by construction — the
# screen has to flag them, so it needs to see them.
screen:
  benchmark: VT
  years: 10
  candidates:
    # bonds, across maturities and credit
    [TLT, IEF, SHY, BIL, TIP, LQD, HYG, AGG, BNDX, EMB,
     # metals and commodities
     GLD, SLV, DBC, PDBC, USO, PPLT, GDX,
     # currencies (dollar, yen, franc — classic risk-off destinations)
     UUP, FXY, FXF,
     # alternatives: managed futures, anti-beta, volatility
     DBMF, KMLM, BTAL, VIXY,
     # real assets and defensive equity
     VNQ, VNQI, IGF, XLU, XLP, USMV,
     # inverse equity (structural decay — included to be flagged, not recommended)
     SH, PSQ,
     # broad equity, as a sanity check that the screen ranks them last
     SPY, QQQ, EFA, EEM]
